[project]
name = "async-llm-streaming-study"
version = "0.1.0"
description = "Study examples for asyncio, parallel LLM calls, and streaming responses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
async-llm-demo = "async_llm_streaming.demo:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_llm_streaming"]

[tool.pytest.ini_options]
pythonpath = ["src"]
